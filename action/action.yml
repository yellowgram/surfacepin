# Adopters: pin yellowgram/surfacepin/action@v1.6.0 (exact tag, reproducible hasher).
# @v1 is a floating major tag. It may move within 1.x and is not that pin.
# Today v1 still names the older file-mode action (no surface / server-command).
name: SurfacePin
description: >
  Verify a committed surfacepin.lock.json (exact hash; fail on drift).
  File mode (tools-path) or live MCP stdio (server-command).
  Optional surface input (default: the surfaces in the lockfile).
  Pin @v1.6.0 (exact tag) for a reproducible hasher.
  Floating @v1 may move within major 1.x and is not that pin.
author: yellowgram
branding:
  icon: lock
  color: gray-dark

inputs:
  tools-path:
    description: >
      File mode. Path to a surface JSON dump (tools/list shaped, or a combined
      { "tools", "resources", "prompts" } document). Omit when server-command is set.
    required: false
    default: ""
  lockfile-path:
    description: Path to the committed lockfile (usually surfacepin.lock.json)
    required: true
  surface:
    description: >
      Comma-separated surfaces to verify (tools, resources, prompts, instructions).
      Omit to verify whatever the lockfile holds. If set, it must match the lockfile.
    required: false
    default: ""
  server-command:
    description: >
      Live stdio mode. Executable for the MCP server. The action runs
      surfacepin verify --stdio [--surface …] <lockfile> -- <server-command> <server-args>.
      Omit for file mode.
    required: false
    default: ""
  server-args:
    description: >
      Arguments appended after server-command. Whitespace-separated, or one
      argument per line when the value contains a newline.
    required: false
    default: ""
  clean-env:
    description: >
      Stdio mode. "true" starts the server with only HOME, PATH, USER and the
      like, instead of the job's whole environment (which includes any secrets
      the job has). Default "false".
    required: false
    default: "false"
  env-allow:
    description: >
      Stdio mode. Comma list of variable names the server may see, on top of the
      clean base (implies clean-env). Example: "API_BASE_URL,FEATURE_FLAGS".
    required: false
    default: ""
  node-version:
    description: >
      Node.js version the action installs (22 or 24). This runs actions/setup-node
      in your job, so later steps in the same job also use this Node.
    required: false
    default: "22"
  working-directory:
    description: Working directory for paths (default repo root)
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install SurfacePin
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        ACTION_ROOT="${{ github.action_path }}"
        if [ ! -f "$ACTION_ROOT/../package.json" ]; then
          echo "::error title=SurfacePin::run this action as yellowgram/surfacepin/action@<tag> so the hasher matches the tag" >&2
          exit 2
        fi
        cd "$ACTION_ROOT/.."
        # npm ci installs exactly the committed lockfile: same tag, same hasher.
        # --include=dev: the build needs TypeScript even when the job sets NODE_ENV=production.
        npm ci --ignore-scripts --no-audit --no-fund --include=dev
        npm run build
        echo "SURFACEPIN_BIN=$ACTION_ROOT/../dist/cli.js" >> "$GITHUB_ENV"

    - name: Verify surface lock
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SURFACEPIN_TOOLS_PATH: ${{ inputs.tools-path }}
        SURFACEPIN_LOCKFILE: ${{ inputs.lockfile-path }}
        SURFACEPIN_WORKDIR: ${{ inputs.working-directory }}
        SURFACEPIN_SURFACE: ${{ inputs.surface }}
        SURFACEPIN_SERVER_COMMAND: ${{ inputs.server-command }}
        SURFACEPIN_SERVER_ARGS: ${{ inputs.server-args }}
        SURFACEPIN_CLEAN_ENV: ${{ inputs.clean-env }}
        SURFACEPIN_ENV_ALLOW: ${{ inputs.env-allow }}
      run: bash "${{ github.action_path }}/verify.sh"
