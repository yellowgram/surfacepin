name: SurfacePin
description: >
  Verify a committed surfacepin.lock.json (exact hash; fail on drift).
  File mode (tools-path) or live MCP stdio (server-command).
  Optional surface input selects tools, resources, and prompts.
author: yellowgram
branding:
  icon: lock
  color: gray-dark

inputs:
  tools-path:
    description: >
      File mode. Path to a surface JSON dump (tools/list shaped, or a combined
      { "tools", "resources", "prompts" } document). Omit when server-command is set.
    required: false
    default: ""
  lockfile-path:
    description: Path to surfacepin.lock.json (keep this filename)
    required: true
  surface:
    description: >
      Comma-separated surfaces to verify (tools, resources, prompts).
      Omit for tools only. Must match the surfaces stored in the lockfile.
    required: false
    default: ""
  server-command:
    description: >
      Live stdio mode. Executable for the MCP server. The action runs
      surfacepin verify --stdio [--surface …] <lockfile> -- <server-command> <server-args>.
      Omit for file mode.
    required: false
    default: ""
  server-args:
    description: >
      Arguments appended after server-command. Whitespace-separated, or one
      argument per line when the value contains a newline.
    required: false
    default: ""
  working-directory:
    description: Working directory for paths (default repo root)
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install SurfacePin
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # Prefer action-bundled sources when this action is checked out as yellowgram/surfacepin
        ACTION_ROOT="${{ github.action_path }}"
        if [ -f "$ACTION_ROOT/../package.json" ]; then
          cd "$ACTION_ROOT/.."
          npm install --ignore-scripts
          npm run build
          echo "SURFACEPIN_BIN=$ACTION_ROOT/../dist/cli.js" >> "$GITHUB_ENV"
        else
          npm install -g surfacepin
          echo "SURFACEPIN_BIN=surfacepin" >> "$GITHUB_ENV"
        fi

    - name: Verify surface lock
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SURFACEPIN_TOOLS_PATH: ${{ inputs.tools-path }}
        SURFACEPIN_LOCKFILE: ${{ inputs.lockfile-path }}
        SURFACEPIN_SURFACE: ${{ inputs.surface }}
        SURFACEPIN_SERVER_COMMAND: ${{ inputs.server-command }}
        SURFACEPIN_SERVER_ARGS: ${{ inputs.server-args }}
      run: bash "${{ github.action_path }}/verify.sh"
