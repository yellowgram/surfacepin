name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke
        run: |
          node dist/cli.js verify examples/tools.json examples/surfacepin.lock.json
          node dist/cli.js lock examples/tools.json -o /tmp/surfacepin.lock.json
          node dist/cli.js diff examples/tools.json /tmp/surfacepin.lock.json
