name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke
        run: |
          node dist/cli.js verify examples/tools.json examples/surfacepin.lock.json
          node dist/cli.js lock examples/tools.json -o /tmp/surfacepin.lock.json
          node dist/cli.js diff examples/tools.json /tmp/surfacepin.lock.json
      - name: Foreign SDK default path
        run: node examples/sdk-default-path/check.mjs

  # Local composite action (./action), not the published @v1 tag.
  # file-tools keeps the old tools-path + lockfile-path contract.
  action-verify:
    runs-on: ubuntu-latest
    name: action-verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: file-tools
            tools-path: examples/tools.json
            lockfile-path: examples/surfacepin.lock.json
            surface: ""
            server-command: ""
            server-args: ""
          - name: file-multi
            tools-path: testdata/basic.surface.json
            lockfile-path: testdata/basic.multi.lock.json
            surface: tools,resources,prompts
            server-command: ""
            server-args: ""
          - name: stdio-stub
            tools-path: ""
            lockfile-path: testdata/basic.multi.lock.json
            surface: tools,resources,prompts
            server-command: node
            server-args: testdata/stub-mcp-server.mjs
          - name: stdio-sdk
            tools-path: ""
            lockfile-path: examples/sdk-default-path/surfacepin.lock.json
            surface: tools
            server-command: node
            server-args: examples/sdk-default-path/server.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          tools-path: ${{ matrix.tools-path }}
          lockfile-path: ${{ matrix.lockfile-path }}
          surface: ${{ matrix.surface }}
          server-command: ${{ matrix.server-command }}
          server-args: ${{ matrix.server-args }}
