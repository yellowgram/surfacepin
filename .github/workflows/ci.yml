name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke
        run: |
          node dist/cli.js verify examples/tools.json examples/surfacepin.lock.json
          node dist/cli.js lock examples/tools.json -o /tmp/surfacepin.lock.json
          node dist/cli.js diff examples/tools.json /tmp/surfacepin.lock.json
      - name: Foreign SDK default path
        run: node examples/sdk-default-path/check.mjs

  # Local composite action (./action), not a published tag.
  # file-tools keeps the old tools-path + lockfile-path contract.
  action-verify:
    runs-on: ubuntu-latest
    name: action-verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: file-tools
            tools-path: examples/tools.json
            lockfile-path: examples/surfacepin.lock.json
            surface: ""
            server-command: ""
            server-args: ""
          - name: file-multi
            tools-path: testdata/basic.surface.json
            lockfile-path: testdata/basic.multi.lock.json
            surface: tools,resources,prompts
            server-command: ""
            server-args: ""
          - name: stdio-stub
            tools-path: ""
            lockfile-path: testdata/basic.multi.lock.json
            surface: tools,resources,prompts
            server-command: node
            server-args: testdata/stub-mcp-server.mjs
          - name: stdio-sdk
            tools-path: ""
            lockfile-path: examples/sdk-default-path/surfacepin.lock.json
            surface: tools
            server-command: node
            server-args: examples/sdk-default-path/server.mjs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./action
        with:
          tools-path: ${{ matrix.tools-path }}
          lockfile-path: ${{ matrix.lockfile-path }}
          surface: ${{ matrix.surface }}
          server-command: ${{ matrix.server-command }}
          server-args: ${{ matrix.server-args }}

  pack-from-clean-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Pack from a fresh clone, install the tarball, import it
        run: scripts/pack-smoke.sh 'test -e node_modules/.bin/surfacepin && node_modules/.bin/surfacepin verify "$SRC/examples/tools.json" "$SRC/examples/surfacepin.lock.json"'
